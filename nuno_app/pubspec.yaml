name: nuno_app
description: Nuno - multiplayer card game client for the Nuno backend.
publish_to: 'none'
version: 1.0.0+1

# Requires Flutter 3.27+ / Dart 3.6+
# (uses Color.withValues, CardThemeData, DialogThemeData, TabBarThemeData)
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  # v3 is required for a Socket.IO 4.7+ server (the backend runs 4.8.x).
  # The v2 client only speaks to servers up to 4.6, and the mismatch shows up
  # as a connect timeout rather than a protocol error, because the handshake
  # is simply never completed.
  socket_io_client: ^3.1.6

  # Voice chat. The backend already relays offer/answer/ICE (src/voice/), but
  # nothing on this side produced or consumed audio, so the mic button only
  # ever toggled its own icon.
  # 1.x compiles against API 36. The 0.12.x line was built against API 31,
  # which fails the AAR metadata check the moment any modern androidx
  # dependency is pulled in ("requires ... compile against version 34 or
  # later"), and the plugin's own compileSdk is not something an app can
  # override.
  flutter_webrtc: ^1.6.0
  permission_handler: ^11.3.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # assets/launcher/ holds the Android mipmap sources; setup.sh and
    # fix_android.ps1 copy them into android/. They are deliberately not
    # bundled into the app itself.
