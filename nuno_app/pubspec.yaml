name: nuno_app
description: Nuno - multiplayer card game client for the Nuno backend.
publish_to: 'none'
version: 1.0.0+1

# Requires Flutter 3.27+ / Dart 3.6+
# (uses Color.withValues, CardThemeData, DialogThemeData, TabBarThemeData)
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # assets/launcher/ holds the Android mipmap sources; setup.sh and
    # fix_android.ps1 copy them into android/. They are deliberately not
    # bundled into the app itself.
